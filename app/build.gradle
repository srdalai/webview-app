apply plugin: 'com.android.application'

android {
    compileSdk 36
    defaultConfig {
        applicationId "com.sdtechnocrat.webviewapp"
        minSdkVersion 21
        targetSdkVersion 36
        versionCode 2
        versionName "1.0.1"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    flavorDimensions.add("website")
    productFlavors {
        demo {
            dimension "website"
            applicationId "com.release.webview"
            versionCode 2
            versionName "1.0.1"
        }

        mgroup {
            dimension "website"
            applicationId "com.ntpl.mgrouphome"
            versionCode 4
            versionName "1.0.3"
        }

        biiconnect {
            dimension "website"
            applicationId "com.ntpl.biiconnect"
            versionCode 1
            versionName "1.0.0"
        }

        moontv {
            dimension "website"
            applicationId "com.ntpl.moontvdigital"
            versionCode 1
            versionName "1.0.1"
        }

        smartkhana {
            dimension "website"
            applicationId "com.ntpl.smartkhana"
            versionCode 1
            versionName "1.0.0"
        }

        biiconnectHrm {
            dimension "website"
            applicationId "com.ntpl.biiconnecthrm"
            versionCode 1
            versionName "1.0.1"
        }

        biiconnectBms {
            dimension "website"
            applicationId "com.biisoftech.bms"
            versionCode 1
            versionName "1.0.0"
        }

        biniPattnaik {
            dimension "website"
            applicationId "com.ntpl.binipattnaik"
            versionCode 1
            versionName "1.0.0"
        }
    }
    namespace 'com.sdtechnocrat.webviewapp'
    android.applicationVariants.all { variant ->
        variant.outputs.all { output ->
            // New one or Updated one
            output.outputFileName = "${variant.getFlavorName()}_${variant.buildType.name}_v${versionName}.apk"
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.palette:palette:1.0.0'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.activity:activity:1.11.0'
}